<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color"
          content="#ffffff">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <meta name="apple-mobile-web-app-title"
          content="商品販売管理">

    <link rel="manifest"
          href="manifest.json">

    <title>商品販売管理システム</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .total-box {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .total-box span {
            font-size: 32px;
            font-weight: bold;
        }

        .add-box {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 18px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .add-button {
            width: 100%;
            background: #333;
            color: white;
            font-size: 18px;
            padding: 14px;
        }

        .product {
            background: white;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .product-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .price {
            color: #555;
            margin-bottom: 8px;
        }

        .sales-count {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .product-sales {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .sales-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .minus {
            flex: 1;
            background: #ddd;
            font-size: 28px;
        }

        .plus {
            flex: 1;
            background: #333;
            color: white;
            font-size: 28px;
        }

        .management-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .management-buttons button {
            background: #eee;
        }

        .delete-button {
            background: #ffdddd !important;
            color: #a00;
        }

    </style>

</head>

<body>

    <h1>商品販売管理システム</h1>

    <div class="total-box">

        <div>総売上</div>

        <span id="totalSales">
            0
        </span>

        円

    </div>


    <div class="add-box">

        <h2>商品追加</h2>

        <label>
            商品名
        </label>

        <input
            type="text"
            id="productName"
            placeholder="商品名"
        >

        <label>
            単価
        </label>

        <input
            type="number"
            id="productPrice"
            min="0"
            inputmode="numeric"
            placeholder="単価"
        >

        <button
            class="add-button"
            id="addProductButton">
            商品を追加
        </button>

    </div>


    <h2>商品一覧</h2>

    <div id="productList"></div>


    <script src="app.js"></script>

</body>

</html>
